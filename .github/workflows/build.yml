name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 用仓库 secret 里的固定密钥签名 —— 这样后续每个版本都能直接覆盖安装。
      # 注意：这里刻意不用 `if: secrets.X`（步骤级条件里引用 secrets 会让 GitHub 拒绝整个 workflow），
      # 改成在 shell 里判断。
      - name: Write signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -z "$KS_B64" ]; then
            echo "no keystore secret (e.g. pull request) — building unsigned"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          echo "keystore written: $(stat -c%s "$RUNNER_TEMP/ks/release.jks") bytes"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/ks/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTouchpad-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
