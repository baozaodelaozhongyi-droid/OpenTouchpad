name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.86)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 正式发布必须使用仓库 secret 中的固定密钥签名，确保后续版本可覆盖安装。
      - name: Write signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -z "$KS_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is required for release builds"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          echo "keystore written: $(stat -c%s "$RUNNER_TEMP/ks/release.jks") bytes"

      - name: Run unit tests & build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/ks/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon test assembleRelease

      - name: Prepare release asset
        id: prep
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Signed release APK not found at $APK_SRC"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APK_OUT="$RUNNER_TEMP/OpenTouchpad-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTouchpad-${{ steps.prep.outputs.tag }}
          path: ${{ steps.prep.outputs.apk }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          APK_OUT: ${{ steps.prep.outputs.apk }}
        run: |
          NOTES_FILE="CHANGELOG-${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "OpenTouchpad ${TAG}" --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" "$APK_OUT" --title "OpenTouchpad ${TAG}" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" "$APK_OUT" --title "OpenTouchpad ${TAG}" --generate-notes
            fi
          fi
